// DataRewriter for Minecraft 26.1.2, NeoForge only. Same packages and class names as the 1.21.1 MultiLoader
// build on the multiloader branch (common/ + neoforge/), so changes can be carried over file by file.
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}+${minecraft_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            // Screenshot harness (see ScreenshotHarness). ModDevGradle runs ignore Gradle's --args, so the
            // world comes from -PquickPlay=<world> here.
            ['screenshotTypes', 'screenshotSample'].each { name ->
                if (project.hasProperty(name)) {
                    systemProperty("datarewriter.$name", project.property(name).toString())
                }
            }
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
            }
            if (project.hasProperty('username')) {
                programArguments.addAll('--username', project.property('username').toString())
            }
        }
        server {
            server()
            gameDirectory = project.file('run-server')
        }
    }

    mods {
        datarewriter {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenLocal {
        content { includeGroup 'dev.emi' }
    }
    maven {
        name = 'Minecraft Forge'
        url = 'https://maven.minecraftforge.net/'
        content { includeGroup 'com.github.glitchfiend' }
    }
}

dependencies {
    compileOnly "dev.emi:emi-continued-neoforge:${emi_version}:api"
    // Dev runtime only, so the integrations can be tested in runClient/runServer. Nothing of them ends up in
    // the jar.
    runtimeOnly "dev.emi:emi-continued-neoforge:${emi_version}"
    def thaumcraft = files(thaumcraft_jar)
    compileOnly thaumcraft
    if (file(thaumcraft_jar).exists()) {
        runtimeOnly thaumcraft
        runtimeOnly("com.github.glitchfiend:TerraBlender-neoforge:${terrablender_version}") { transitive = false }
    }
}

processResources {
    def props = [version: version, minecraft_version: minecraft_version, neoforge_version: neoforge_min_version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

jar {
    from(rootProject.file('LICENSE.txt')) { rename { "${it}_DataRewriter" } }
}
