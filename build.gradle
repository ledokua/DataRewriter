// DataRewriter for Minecraft 26.1.2, NeoForge only. Same packages and class names as the 1.21.1 MultiLoader
// build on the multiloader branch (common/ + neoforge/), so changes can be carried over file by file.
plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}+${minecraft_version}"
group = maven_group

base {
    archivesName = archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.addAll(['-Xmaxerrs', '5000'])
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            // Screenshot harness (see ScreenshotHarness). ModDevGradle runs ignore Gradle's --args, so the
            // world comes from -PquickPlay=<world> here.
            ['screenshotTypes', 'screenshotSample'].each { name ->
                if (project.hasProperty(name)) {
                    systemProperty("datarewriter.$name", project.property(name).toString())
                }
            }
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlay').toString())
            }
            if (project.hasProperty('username')) {
                programArguments.addAll('--username', project.property('username').toString())
            }
        }
        server {
            server()
            gameDirectory = project.file('run-server')
        }
    }

    mods {
        datarewriter {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    def emi = files(emi_jar)
    compileOnly emi
    // Dev runtime only, so the EMI integration can be tested in runClient. Nothing of it ends up in the jar.
    if (file(emi_jar).exists()) {
        runtimeOnly emi
    }
}

processResources {
    def props = [version: version, minecraft_version: minecraft_version, neoforge_version: neoforge_version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

jar {
    from(rootProject.file('LICENSE.txt')) { rename { "${it}_DataRewriter" } }
}
