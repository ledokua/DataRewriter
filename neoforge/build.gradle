// NeoForge glue: @Mod entrypoints, payload/lifecycle event bridging, menu registration.
plugins {
    id 'net.neoforged.moddev'
}

repositories {
    maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/releases/" }
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven"; content { includeGroup "maven.modrinth" } }
}

base {
    archivesName = "${rootProject.archives_base_name}-neoforge"
}

def commonSourceSet = project(':common').sourceSets.main

neoForge {
    version = rootProject.neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            // Screenshot harness, same properties as :fabric:runClient (see fabric/build.gradle). ModDevGradle
            // runs ignore Gradle's --args, so the world comes from -PquickPlay=<world> here.
            ["screenshotTypes", "screenshotSample"].each { name ->
                if (project.hasProperty(name)) {
                    systemProperty("datarewriter.$name", project.property(name).toString())
                }
            }
            if (project.hasProperty("quickPlay")) {
                programArguments.addAll("--quickPlaySingleplayer", project.property("quickPlay").toString())
            }
        }
        server {
            server()
            gameDirectory = project.file('run-server')
        }
    }

    mods {
        datarewriter {
            sourceSet sourceSets.main
            sourceSet commonSourceSet
        }
    }
}

dependencies {
    compileOnly project(path: ':common', configuration: 'namedElements')
    // Dev runtime only, so the EMI integration can be tested in :neoforge:runClient (FML finds mod jars on
    // the runtime classpath). Nothing of it ends up in the release jar.
    runtimeOnly "dev.emi:emi-neoforge:${rootProject.emi_version}"
    // Bundled-layout targets for dev runs, same deal: hand-checking the bundled mod layouts.
    runtimeOnly("maven.modrinth:forbidden-arcanus:2.6.1") { transitive = false }
    runtimeOnly("maven.modrinth:valhelsia-core:1.1.4") { transitive = false }
    runtimeOnly("maven.modrinth:ars-nouveau:5.13.1") { transitive = false }
    runtimeOnly("maven.modrinth:curios:9.5.1+1.21.1") { transitive = false }
    runtimeOnly("maven.modrinth:geckolib:Grwn5rUB") { transitive = false }
    runtimeOnly("maven.modrinth:mystical-agriculture:PLakgT6X") { transitive = false }
    runtimeOnly("maven.modrinth:cucumber:8421rqFF") { transitive = false }
    runtimeOnly("maven.modrinth:eidolonrepraised:e82la8yu") { transitive = false }
    runtimeOnly("maven.modrinth:malum:BIbVs1fo") { transitive = false }
    runtimeOnly("maven.modrinth:lodestonelib:CohX6yP1") { transitive = false }
}

processResources {
    from commonSourceSet.resources
    inputs.property "version", project.version
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "neoforge_version", rootProject.neoforge_version
    filteringCharset "UTF-8"
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version,
                "minecraft_version": rootProject.minecraft_version,
                "neoforge_version": rootProject.neoforge_version
    }
}

jar {
    from commonSourceSet.output.classesDirs
    from(rootProject.file("LICENSE.txt")) { rename { "${it}_${rootProject.archives_base_name}" } }
}

sourcesJar {
    from commonSourceSet.allSource
}
